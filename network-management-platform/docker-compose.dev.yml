version: '3.8'

services:
  # PostgreSQL with TimescaleDB for time-series data
  database:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: network_mgmt
      POSTGRES_USER: netmgmt
      POSTGRES_PASSWORD: secure_password_123
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped

  # Network Management Backend (without GPU for development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://netmgmt:secure_password_123@database:5432/network_mgmt
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-key-please-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - ./backend:/app
      - backup_storage:/app/backups
    ports:
      - "8001:8000"
    depends_on:
      - database
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backup_storage: