version: '3.8'

services:
  # PostgreSQL with TimescaleDB for time-series data
  database:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: network_mgmt
      POSTGRES_USER: netmgmt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped

  # Ray Head Node (GPU enabled)
  ray-head:
    build:
      context: ./ray-cluster
      dockerfile: Dockerfile.ray-head
    environment:
      RAY_DISABLE_IMPORT_WARNING: 1
      RAY_USAGE_STATS_ENABLED: 0
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
    volumes:
      - ./ray-cluster/config:/ray/config
      - ray_logs:/tmp/ray
    ports:
      - "8265:8265"  # Ray Dashboard
      - "10001:10001"  # Ray Client
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    restart: unless-stopped

  # Network Management Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://netmgmt:${DB_PASSWORD:-secure_password_123}@database:5432/network_mgmt
      REDIS_URL: redis://redis:6379
      RAY_ADDRESS: ray-head:10001
      CUDA_VISIBLE_DEVICES: "4,5,6,7"
    volumes:
      - ./backend:/app
      - backup_storage:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      - database
      - redis
      - ray-head
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    restart: unless-stopped

  # Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ray_logs:
  backup_storage:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge