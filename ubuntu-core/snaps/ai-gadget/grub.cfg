# GRUB configuration for AI Hardware Ubuntu Core 24

set default=0
set timeout=3
set timeout_style=hidden

# Load modules
insmod part_gpt
insmod ext2
insmod squash4
insmod biosdisk
insmod linux
insmod configfile
insmod search
insmod search_fs_uuid

# Set console parameters
set console="console=ttyS0,115200n8 console=tty1"

# GPU and performance kernel parameters
set gpu_params="intel_iommu=on iommu=pt pci=realloc pcie_aspm=off"
set perf_params="processor.max_cstate=0 intel_idle.max_cstate=0"
set memory_params="transparent_hugepage=never numa_balancing=disable"
set cpu_params="isolcpus=managed_irq,domain,2-7 nohz_full=2-7 rcu_nocbs=2-7"

# Combine all parameters
set cmdline="$console $gpu_params $perf_params $memory_params $cpu_params panic=-1"

# Set graphical terminal
if [ "${grub_platform}" == "efi" ]; then
    insmod efi_gop
    insmod efi_uga
    insmod font
    if loadfont ${prefix}/unicode.pf2; then
        insmod gfxterm
        set gfxmode=auto
        set gfxpayload=keep
        terminal_output gfxterm
    fi
fi

# Function to load Ubuntu Core
function load_ubuntu_core {
    # Search for the boot partition
    search --no-floppy --set=boot_fs --label ubuntu-boot
    
    if [ -n "${boot_fs}" ]; then
        set root="${boot_fs}"
        # Load kernel and initrd
        linux /kernel.img $cmdline snapd_recovery_mode=run
        initrd /initrd.img
        boot
    fi
}

# Recovery menu
menuentry "Ubuntu Core 24 - Normal Boot" {
    load_ubuntu_core
}

menuentry "Ubuntu Core 24 - Recovery Mode" {
    # Search for seed partition
    search --no-floppy --set=seed_fs --label ubuntu-seed
    set root="${seed_fs}"
    
    # Load recovery system
    set snapd_recovery_mode=recover
    set snapd_recovery_system=
    
    # Find recovery system
    for label in /systems/*/; do
        if [ -e "${label}/kernel.img" ]; then
            regexp --set=1:label "/systems/(.*)/\$" "${label}"
            set snapd_recovery_system="${label}"
            break
        fi
    done
    
    if [ -n "${snapd_recovery_system}" ]; then
        linux /systems/${snapd_recovery_system}/kernel.img $cmdline snapd_recovery_mode=recover snapd_recovery_system=${snapd_recovery_system}
        initrd /systems/${snapd_recovery_system}/initrd.img
        boot
    fi
}

menuentry "Ubuntu Core 24 - Factory Reset" {
    # Search for seed partition
    search --no-floppy --set=seed_fs --label ubuntu-seed
    set root="${seed_fs}"
    
    # Find recovery system
    set snapd_recovery_mode=factory-reset
    set snapd_recovery_system=
    
    for label in /systems/*/; do
        if [ -e "${label}/kernel.img" ]; then
            regexp --set=1:label "/systems/(.*)/\$" "${label}"
            set snapd_recovery_system="${label}"
            break
        fi
    done
    
    if [ -n "${snapd_recovery_system}" ]; then
        linux /systems/${snapd_recovery_system}/kernel.img $cmdline snapd_recovery_mode=factory-reset snapd_recovery_system=${snapd_recovery_system}
        initrd /systems/${snapd_recovery_system}/initrd.img
        boot
    fi
}

menuentry "System Settings" {
    # Show system information
    echo "AI Hardware Ubuntu Core 24"
    echo "Optimized for GPU Computing"
    echo ""
    echo "Boot Parameters:"
    echo "$cmdline"
    echo ""
    echo "Press any key to return to menu..."
    read
}

# Fallback
menuentry "UEFI Firmware Settings" {
    fwsetup
}