# AI Worker Node Configuration

# Ray cluster settings
RAY_HEAD_IP=192.168.1.100
RAY_HEAD_PORT=6379
RAY_OBJECT_STORE_SIZE=auto
RAY_PLASMA_DIRECTORY=/tmp

# Model cache settings
MODEL_CACHE_DIR=$SNAP_COMMON/models
MODEL_CACHE_SIZE=50G
HF_HOME=$SNAP_COMMON/models/huggingface
TRANSFORMERS_CACHE=$SNAP_COMMON/models/transformers

# GPU settings
CUDA_VISIBLE_DEVICES=all
TF_GPU_THREAD_MODE=gpu_private
PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
TF_FORCE_GPU_ALLOW_GROWTH=true

# Performance tuning
OMP_NUM_THREADS=auto
MKL_NUM_THREADS=auto
NUMEXPR_NUM_THREADS=auto

# Monitoring
ENABLE_GPU_MONITORING=true
METRICS_PORT=8080
LOG_LEVEL=INFO

# Network settings
WORKER_BIND_ADDRESS=0.0.0.0
WORKER_PORT_RANGE=10000-10100

# Resource limits
MAX_MEMORY_PERCENT=90
MAX_CPU_PERCENT=95

# AI Framework settings
TORCH_HOME=$SNAP_COMMON/models/torch
TF_CPP_MIN_LOG_LEVEL=2

# Distributed training
NCCL_DEBUG=INFO
NCCL_SOCKET_IFNAME=eth0
GLOO_SOCKET_IFNAME=eth0