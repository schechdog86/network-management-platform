name: ray-head
version: '1.0'
summary: Ray Cluster Head Node for AI Orchestration
description: |
  Ray cluster head node for distributed AI workload orchestration.
  Manages AI workers, schedules jobs, and provides cluster monitoring.
  Integrated with network management platform for seamless AI operations.

base: core24
grade: stable
confinement: strict

architectures:
  - build-on: amd64

environment:
  PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3.12/site-packages
  RAY_HEAD_NODE_IP: "0.0.0.0"
  RAY_PORT: "6379"
  RAY_DASHBOARD_PORT: "8265"
  RAY_REDIS_PORT: "6380"
  RAY_OBJECT_MANAGER_PORT: "8076"
  RAY_NODE_MANAGER_PORT: "8077"
  RAY_MIN_WORKER_NODES: "0"
  RAY_MAX_WORKER_NODES: "100"

layout:
  /tmp/ray:
    bind: $SNAP_DATA/ray
  /var/log/ray:
    bind: $SNAP_DATA/logs

apps:
  ray-head:
    command: bin/start-ray-head
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - hardware-observe
      - system-observe
      - process-control
    environment:
      RAY_USAGE_STATS_ENABLED: "0"
      RAY_DEDUP_LOGS: "1"

  ray-dashboard:
    command: bin/start-dashboard
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
    after: [ray-head]

  ray-cli:
    command: usr/bin/ray
    plugs:
      - network
      - home

  rayctl:
    command: bin/rayctl
    plugs:
      - network

slots:
  ray-cluster:
    interface: content
    content: ray-cluster
    write:
      - $SNAP_DATA/cluster

plugs:
  network-api:
    interface: content
    content: network-manager-api
    target: $SNAP_DATA/network-api

parts:
  ray-deps:
    plugin: python
    source: .
    python-packages:
      # Ray core
      - ray[default]==2.9.1
      - ray[serve]==2.9.1
      - ray[tune]==2.9.1
      
      # ML frameworks
      - torch==2.1.2
      - tensorflow==2.15.0
      - transformers==4.36.2
      - scikit-learn==1.4.0
      
      # Distributed computing
      - dask==2023.12.1
      - distributed==2023.12.1
      
      # Monitoring
      - prometheus-client==0.19.0
      - opencensus==0.11.3
      - py-spy==0.3.14
      
      # Utilities
      - redis==5.0.1
      - requests==2.31.0
      - click==8.1.7
      - rich==13.7.0
      - tabulate==0.9.0
      
      # Optimization
      - optuna==3.5.0
      - hyperopt==0.2.7

  scripts:
    plugin: dump
    source: scripts/
    organize:
      start-ray-head.sh: bin/start-ray-head
      start-dashboard.sh: bin/start-dashboard
      rayctl.py: bin/rayctl
      cluster-init.py: bin/cluster-init
      health-check.py: bin/health-check
    stage:
      - bin/*

  config:
    plugin: dump
    source: config/
    organize:
      ray-config.yaml: etc/ray-config.yaml
      cluster-config.yaml: etc/cluster-config.yaml
      autoscaler-config.yaml: etc/autoscaler-config.yaml